services:
  backend:
    build:
      context: ./backend
    container_name: scopa-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    expose:
      - "8080"
    networks:
      - apps-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: scopa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - apps-network

networks:
  apps-network:
    external: true
